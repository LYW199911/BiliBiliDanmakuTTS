<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>BiliDanmakuTTS</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #FFFFFF;
      color: #18191C;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #F1F2F3;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .logo-badge {
      width: 32px;
      height: 32px;
      background: #FB7299;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 18px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      color: #18191C;
    }
    .subtitle {
      font-size: 11px;
      color: #9499A0;
    }
    .feature-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 12px;
      color: #61666D;
      line-height: 1.5;
      margin-bottom: 14px;
    }
    .feature-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .feature-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #FB7299;
      margin-top: 7px;
      flex-shrink: 0;
    }
    .shortcut-badge {
      background: #F6F7F8;
      border: 1px solid #E3E5E7;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
      color: #18191C;
    }
    .btn {
      display: block;
      width: 100%;
      text-align: center;
      padding: 9px;
      background: #00A1D6;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      box-sizing: border-box;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #008CB9;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-badge">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
    </div>
    <div>
      <div class="title">BiliDanmakuTTS</div>
      <div class="subtitle">息屏听弹幕助手</div>
    </div>
  </div>

  <div class="feature-list">
    <div class="feature-item">
      <span class="feature-dot"></span>
      <span>快捷开关：在视频播放页按快捷键 <span class="shortcut-badge">Alt + D</span></span>
    </div>
    <div class="feature-item">
      <span class="feature-dot"></span>
      <span>智能降噪：高能梗词加权、水词过滤与复读自动折叠</span>
    </div>
    <div class="feature-item">
      <span class="feature-dot"></span>
      <span>侧链压限：播报时自动按比例平滑压低视频原声</span>
    </div>
  </div>

  <a href="https://www.bilibili.com" target="_blank" class="btn">打开 B 站视频体验</a>
</body>
</html>
